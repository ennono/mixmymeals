<!--
	BEISPIEL-/REFERENZ-TEMPLATE für Abo-Mails.

	Die echten Templates liegen im Child-Theme unter:
		mixmymeals-astra-child/mixmymeals/emails/
	(layout.html = gemeinsamer Rahmen, plus ein Template je Trigger:
	 each-day.html, on-start.html, before-start.html, evening-before.html,
	 on-confirm.html).

	So legst du ein eigenes Template an: diese Datei ins Child-Theme nach
	mixmymeals/emails/ kopieren, umbenennen und anpassen. Theme-Dateien haben
	Vorrang vor dem Plugin und erscheinen automatisch im Template-Dropdown der
	Sende-Regeln (Einstellungen → Abos).

	Platzhalter werden mit doppelten geschweiften Klammern geschrieben
	(Beispiele unten). Verfügbare Platzhalter (für JEDES Template gleich):
		greeting              Anrede (z. B. „Hallo Timo,")
		weekday               Wochentag, um den es geht
		plan                  Titel des Essensplans
		plan_url              Link zum Plan
		unsubscribe_url       Abmelde-Link
		meal_list_html        Mahlzeiten des Tages, je mit Bild + „Jetzt kochen"-Link
		meal_images_html      Reihe der Mahlzeiten-Bilder des Tages (verlinkt, oder leer)
		day_summary_html      Tagessumme kcal/Kosten (oder leer)
		day_kcal / day_cost / currency
		day_ingredients_html  Zutaten für diesen Tag (fertige Liste)
		shopping_list_html    Komplette Einkaufsliste des Plans
		site_name / site_url / year
-->
<h1>Deine Mahlzeiten am {{ weekday }}</h1>

<p>{{ greeting }}</p>

{{ meal_list_html }}

{{ day_summary_html }}

<h2>Zutaten für heute</h2>

{{ day_ingredients_html }}

<p style="margin-top:16px;"><a href="{{ plan_url }}">Zum vollständigen Plan</a></p>

<p style="color:#6B665B;">Guten Appetit!</p>
